# Тесты на каждый пуш и PR. Python 3.12 — как на сервере бота (riga).
# Пуш в main с зелёными тестами выкатывается на сервер (deploy/deploy.sh, ADR-0005).
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  deploy:
    needs: pytest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      # Ключ в authorized_keys ограничен forced command: сервер выполнит только deploy.sh,
      # переданная строка — лишь SHA. Лог Actions публичный: адрес сервера — в секрете.
      - name: Выкатка на сервер
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ secrets.DEPLOY_TARGET }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -p "${PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 "$TARGET" "$GITHUB_SHA"
